<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <!-- Hexagon background -->
  <polygon points="100,10 185,60 185,160 100,210 15,160 15,60"
           fill="#1f77b4" stroke="#0d3c66" stroke-width="4"/>

  <!-- Main line: 2-slope piecewise -->
  <!-- First segment -->
  <line x1="40" y1="142" x2="70" y2="122"
        stroke="#ffcc00"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Second regime -->
  <polyline points="70,122 100,102 130,82 160,62"
            fill="none"
            stroke="#ffcc00"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Confidence intervals -->
  <line x1="100" y1="102" x2="150" y2="57"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"/>

  <line x1="100" y1="102" x2="165" y2="70"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Horizontal reference line -->
  <line x1="40" y1="77" x2="160" y2="77"
        stroke="#ffffff"
        stroke-width="2"
        stroke-dasharray="6,4"/>

  <!-- Axes -->
  <line x1="40" y1="142" x2="160" y2="142" stroke="#aac4de" stroke-width="1"/>
  <line x1="40" y1="142" x2="40" y2="62" stroke="#aac4de" stroke-width="1"/>

  <!-- Title -->
  <text x="100" y="170"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        text-anchor="middle"
        font-weight="bold">
    <tspan fill="#dce8f2">event</tspan><tspan fill="#ffcc00">Pred</tspan>
  </text>
</svg>